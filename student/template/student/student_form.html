<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>
    <h2>{{ form_title }}</h2>
    <form method="post">
        {% csrf_token %}
        <label for="full_name">Full Name:</label><br>
        <input type="text" name="full_name" value="{{ student.full_name|default:'' }}"><br><br>

        <label for="reg_number">Reg Number:</label><br>
        <input type="text" name="reg_number" value="{{ student.reg_number|default:'' }}"><br><br>

        <button type="submit">Save</button>
    </form>
</body>
</html>
